<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>השמורה המסתורית</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Special+Elite&family=Rubik:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--jd:#0a1508;--gold:#c9a84c;--gold-l:#f0cc6e;--gold-d:#8a6820;--cream:#f5edd8;--dim:#a8c4aa;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;background:#000;color:var(--cream);}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .5s;z-index:10;}
.screen.active{opacity:1;pointer-events:all;}

/* fixed chrome */
.dev-btn-f{position:fixed;top:.5rem;left:.4rem;width:24px;height:24px;background:transparent;border:none;cursor:pointer;z-index:500;opacity:.07;font-size:12px;}
.dev-btn-f:hover{opacity:.35;}
.fs-btn{position:fixed;top:.5rem;left:2rem;background:rgba(0,0,0,.3);border:1px solid rgba(201,168,76,.25);color:rgba(201,168,76,.6);font-size:.85rem;width:24px;height:24px;border-radius:4px;cursor:pointer;z-index:500;display:flex;align-items:center;justify-content:center;}
.back-btn{position:fixed;bottom:.7rem;right:.7rem;background:rgba(10,21,10,.9);border:1px solid rgba(45,106,48,.35);color:var(--dim);font-size:.78rem;padding:.3rem .8rem;border-radius:20px;cursor:pointer;z-index:200;font-family:'Rubik',sans-serif;display:none;transition:all .2s;}
.back-btn.vis{display:block;}
.back-btn:hover{border-color:var(--gold);color:var(--gold);}

/* loading */
#s-load{background:#000;gap:.8rem;}
.spinner{width:38px;height:38px;border:2px solid #142014;border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.load-txt{font-family:'Secular One',sans-serif;color:var(--gold);font-size:.85rem;}

/* curtain */
#s-curtain{z-index:50;overflow:hidden;cursor:pointer;}
.curt-bg{position:absolute;inset:0;background:url('jungle.jpg') center/cover no-repeat;filter:brightness(.3) saturate(.55);transition:filter 1.8s ease;}
.curt-bg.reveal{filter:brightness(.92) saturate(1);}
.curt-r{position:absolute;top:0;right:0;bottom:0;width:65%;z-index:22;transform:translateX(0);transition:transform 1.9s cubic-bezier(.77,0,.18,1);}
.curt-r.open{transform:translateX(102%);}
.curt-l{position:absolute;top:0;left:0;bottom:0;width:65%;z-index:21;transition:transform 1.9s cubic-bezier(.77,0,.18,1) .3s;}
.curt-l.open{transform:translateX(-102%);}
.curt-l img,.curt-r img{position:absolute;width:100%;height:100%;object-fit:cover;}
.curt-l img{object-position:left center;}
.curt-r img{object-position:right center;}
.curt-title{position:absolute;top:50%;left:50%;transform:translate(-50%,-52%);z-index:30;text-align:center;pointer-events:none;transition:opacity .25s ease;}
.curt-title h1{font-family:'Secular One',sans-serif;font-size:clamp(2.4rem,8vw,5.2rem);white-space:nowrap;color:var(--cream);text-shadow:0 0 60px rgba(201,168,76,.95),0 0 120px rgba(201,168,76,.5),0 2px 30px rgba(0,0,0,.98);}
.curt-title.fadeout{opacity:0;}
/* tap hint — fades immediately on click */
.tap-hint{position:absolute;bottom:9%;left:50%;transform:translateX(-50%);z-index:35;font-family:'Rubik',sans-serif;font-size:clamp(.9rem,2.2vw,1.1rem);color:rgba(240,210,140,.82);letter-spacing:.18em;pointer-events:none;animation:phint 2s ease-in-out infinite;transition:opacity .15s;}
.tap-hint.gone{opacity:0!important;animation:none;}
@keyframes phint{0%,100%{opacity:.35}50%{opacity:1}}

/* fireflies */
.ff{position:absolute;border-radius:50%;background:var(--gold-l);box-shadow:0 0 5px 2px rgba(240,204,110,.4);animation:ffloat linear infinite;pointer-events:none;}
@keyframes ffloat{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}85%{opacity:.6}100%{opacity:0;transform:translate(var(--tx),var(--ty))}}

/* shared story screens — identical dark overlay so bg looks same */
.story-screen{background:url('jungle.jpg') center/cover no-repeat;}
.story-screen::before{content:'';position:fixed;inset:0;background:rgba(0,0,0,.68);pointer-events:none;z-index:1;}
#s-intro,#s-brief{justify-content:center;align-items:center;}
#s-intro,#s-brief{background:url('jungle.jpg') center/cover no-repeat;}
#s-intro::before,#s-brief::before{content:'';position:fixed;inset:0;background:rgba(0,0,0,.68);pointer-events:none;z-index:1;}

.story-inner{position:relative;z-index:5;width:100%;max-width:820px;padding:3vh 3vw;display:flex;flex-direction:column;align-items:center;gap:2vh;height:100%;justify-content:center;}

/* story text — fills screen vertically */
.story-txt{
  font-family:'Special Elite',serif;
  color:#fff;
  text-shadow:0 1px 14px rgba(0,0,0,.99);
  line-height:1.75;
  text-align:center;
  width:100%;
  /* dynamic font: grows until text fills ~70% of viewport height */
  font-size:clamp(1.25rem,2.6vh,2rem);
}
.story-txt .sm{font-size:.78em;vertical-align:.05em;}
.tw-cursor{display:inline-block;width:2px;height:.9em;background:var(--gold-l);vertical-align:middle;animation:blink .65s ease infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* big heading in brief */
.story-big{font-size:1.45em;font-weight:700;color:var(--gold-l);display:inline;text-shadow:0 0 28px rgba(201,168,76,.65);}

.btn-gold{font-family:'Rubik',sans-serif;font-weight:600;font-size:clamp(1rem,1.8vh,1.3rem);padding:.8rem 2.2rem;background:linear-gradient(135deg,var(--gold-d),var(--gold));color:var(--jd);border:none;border-radius:8px;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:0 4px 22px rgba(201,168,76,.4);flex-shrink:0;}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 7px 28px rgba(201,168,76,.6);}
.btn-start{opacity:0;transition:opacity .5s;pointer-events:none;}
.btn-start.show{opacity:1;pointer-events:all;}

/* notif */
.notif{position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-10px);background:rgba(40,8,8,.96);border:1px solid #a93226;color:var(--cream);padding:.45rem 1.1rem;border-radius:28px;font-family:'Rubik',sans-serif;font-size:.9rem;z-index:400;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;max-width:92vw;text-align:center;}
.notif.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* dev panel */
.dev-panel{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;opacity:0;pointer-events:none;transition:opacity .25s;padding:1.5rem;}
.dev-panel.open{opacity:1;pointer-events:all;}
.dev-ttl{font-family:'Rubik',sans-serif;color:#0f0;font-size:1.1rem;margin-bottom:.4rem;}
.dev-grid{display:grid;grid-template-columns:1fr 1fr;gap:.45rem;width:100%;max-width:300px;}
.dev-bi{background:#060d06;border:1px solid #1a2a1a;color:#0f0;font-family:monospace;font-size:.78rem;padding:.55rem .4rem;border-radius:5px;cursor:pointer;text-align:center;transition:background .15s;}
.dev-bi:hover{background:#0a180a;border-color:#0f0;}
.dev-bi.red{color:#f55;border-color:#3a1010;}
.dev-bi.red:hover{background:#180a0a;border-color:#f55;}
.dev-close{background:transparent;border:1px solid #222;color:#444;font-size:.75rem;padding:.35rem 1.1rem;border-radius:5px;cursor:pointer;margin-top:.3rem;}
</style>
</head>
<body>

<button class="dev-btn-f" onclick="openDev()">🔧</button>
<button class="fs-btn" onclick="toggleFS()">⛶</button>
<button class="back-btn" id="back-btn" onclick="goBack()">← חזרה</button>

<!-- LOADING -->
<div class="screen active" id="s-load">
  <div class="spinner"></div>
  <div class="load-txt">טוען את השמורה...</div>
</div>

<!-- מסך הכניסה -->
<div class="screen" id="s-curtain" onclick="openCurtain()">
  <div class="curt-bg" id="curt-bg"></div>
  <div class="curt-r" id="cr"><img src="branches_right.png" alt=""></div>
  <div class="curt-l" id="cl"><img src="branches_left.png" alt=""></div>
  <div class="curt-title" id="curt-title"><h1>השמורה המסתורית</h1></div>
  <div class="tap-hint" id="tap-hint">לחצו לכניסה לשמורה</div>
</div>

<!-- מסך הפתיחה -->
<div class="screen" id="s-intro">
  <div class="story-inner">
    <div class="story-txt" id="story-el"></div>
    <button class="btn-gold btn-start" id="btn-start" onclick="startBriefing()">התחילו בחקירה</button>
  </div>
</div>

<!-- מסך ברוכים הבאים -->
<div class="screen" id="s-brief">
  <div class="story-inner">
    <div class="story-txt" id="brief-el"></div>
    <button class="btn-gold btn-start" id="btn-brief-go" onclick="goToStage1()">אל זירת הפשע</button>
  </div>
</div>

<div class="notif" id="notif"></div>

<div class="dev-panel" id="dev-panel">
  <div class="dev-ttl">⚙ DEV MODE — השמורה המסתורית</div>
  <div class="dev-grid">
    <div class="dev-bi" onclick="devGo('s-curtain')">מסך כניסה</div>
    <div class="dev-bi" onclick="devGo('s-intro')">מסך פתיחה</div>
    <div class="dev-bi" onclick="devGo('s-brief')">ברוכים הבאים</div>
    <div class="dev-bi" onclick="devGo('stage1')">זירת הפשע</div>
    <div class="dev-bi" onclick="devGo('stage2')">עדות אנונימית</div>
    <div class="dev-bi" onclick="devGo('stage3')">ספר פרופילים</div>
    <div class="dev-bi" onclick="devGo('stage4')">האשמה</div>
    <div class="dev-bi" onclick="devGo('puzzle')">פאזל מפה</div>
    <div class="dev-bi" onclick="devGo('stage6')">פתיחת קוד</div>
    <div class="dev-bi red" onclick="devReset()" style="grid-column:1/-1">איפוס מלא ↺</div>
  </div>
  <button class="dev-close" onclick="closeDev()">✕ סגור</button>
</div>

<script>
const DEV_CODE='7763';
let screenHistory=[], curtainOpened=false;

window.toggleFS=function(){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen();};

function spawnFF(el,n){
  for(let i=0;i<n;i++){
    const f=document.createElement('div');f.className='ff';
    f.style.cssText=`width:3px;height:3px;left:${Math.random()*100}%;top:${Math.random()*88}%;`;
    f.style.setProperty('--tx',(Math.random()*90-45)+'px');
    f.style.setProperty('--ty',(Math.random()*55-27)+'px');
    f.style.animationDuration=(6+Math.random()*10)+'s';
    f.style.animationDelay=(Math.random()*7)+'s';
    el.appendChild(f);
  }
}

window.goTo=function(id,hist=true){
  if(hist&&!['s-load','s-curtain'].includes(id)){
    const cur=document.querySelector('.screen.active');
    if(cur&&cur.id!==id)screenHistory.push(cur.id);
  }
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById('back-btn').className='back-btn'+(screenHistory.length?' vis':'');
  if(id==='s-intro')setTimeout(startTypewriter,350);
};
window.goBack=function(){if(!screenHistory.length)return;goTo(screenHistory.pop(),false);};

/* CURTAIN */
window.openCurtain=function(){
  if(curtainOpened)return;curtainOpened=true;
  // hint gone immediately
  document.getElementById('tap-hint').classList.add('gone');
  document.getElementById('curt-bg').classList.add('reveal');
  document.getElementById('cr').classList.add('open');
  setTimeout(()=>document.getElementById('cl').classList.add('open'),300);
  setTimeout(()=>document.getElementById('curt-title').classList.add('fadeout'),250);
  setTimeout(()=>goTo('s-intro'),2500);
};

/* TYPEWRITER */
const STORY_RAW='אתמול בלילה<C> תחת אור הירח<C> נגנבה מפת האוצרות העתיקה של שמורת עדן הסודית<P> המפה מובילה אל מיקומי האוצרות הטמונים ברחבי השמורה<C> ביניהם האבן הקסומה שמגינה על השמורה<P> מפת האוצרות הוסתרה במקום סודי בלב השמורה - מקום שרק פקח השמורה יודע עליו<P>\n\nהבוקר גילה הפקח שהמפה נגנבה<C> והוא צריך את עזרתם של צוות בלשים צעירים ומבריקים כדי לפתור את התעלומה - להבין מי מהחיות גנב את המפה ואיך<C> ולהשיב אותה אל פקח השמורה<P>\n\nהבלשית יובל<C> מוכנה לגייס צוות בלשים כדי לעבוד איתך על החקירה המסתורית<Q>';

const BRIEF_RAW='יובל וצוות הבלשים המבריקים<C>\n\n<BIG>ברוכים הבאים לשמורת עדן הסודית!</BIG>\n\nהשמורה ואוצרותיה בסכנה<P> הגנב עלול לפצח את המפה ולהגיע ממש בקרוב אל אוצרות השמורה ואפילו אל האבן הקסומה שמגינה עליה<P>\n\nהחקירה הזו תלויה בכם בלבד<P> יש לכם <B>60 דקות</B> כדי לתפוס את הגנב<C> להחזיר את מפת האוצרות העתיקה לפקח השמורה ולהשיב את הביטחון לכל דיירי השמורה<P>\n\nמוכנים<Q> התחילו מביקור בזירת הפשע<P>\nהזמן שלכם מתחיל לרוץ<P>';

function proc(r){
  return r
    .replace(/<C>/g,'<span class="sm">,</span>')
    .replace(/<P>/g,'<span class="sm">.</span>')
    .replace(/<Q>/g,'<span class="sm">?</span>')
    .replace(/<BIG>(.*?)<\/BIG>/gs,'<span class="story-big">$1</span>')
    .replace(/<B>(.*?)<\/B>/gs,'<strong style="color:var(--gold-l)">$1</strong>');
}
function rawIdx(raw,ts){
  let s=0,r=0;
  const tags=['<C>','<P>','<Q>','<BIG>','</BIG>','<B>','</B>'];
  while(r<raw.length&&s<ts){
    let f=false;
    for(const t of tags){
      if(raw.startsWith(t,r)){
        if(['<BIG>','</BIG>','<B>','</B>'].includes(t))r+=t.length;
        else{s++;r+=t.length;}
        f=true;break;
      }
    }
    if(!f){s++;r++;}
  }
  return r;
}
function typewrite(raw,elId,onDone){
  const el=document.getElementById(elId);
  el.innerHTML='';
  const stripped=raw.replace(/<[^>]+>/g,'');
  let i=0;
  function next(){
    if(i>=stripped.length){
      el.innerHTML=proc(raw).replace(/\n/g,'<br>');
      onDone();return;
    }
    el.innerHTML=proc(raw.slice(0,rawIdx(raw,i+1))).replace(/\n/g,'<br>')+'<span class="tw-cursor"></span>';
    const ch=stripped[i++];
    const d=ch==='.'||ch==='?'?400:ch===','?160:ch==='\n'?650:ch===' '?50:35+Math.random()*20;
    setTimeout(next,d);
  }
  setTimeout(next,180);
}

function startTypewriter(){typewrite(STORY_RAW,'story-el',()=>setTimeout(()=>document.getElementById('btn-start').classList.add('show'),350));}

window.startBriefing=function(){
  document.getElementById('btn-start').classList.remove('show');
  goTo('s-brief');
  typewrite(BRIEF_RAW,'brief-el',()=>setTimeout(()=>document.getElementById('btn-brief-go').classList.add('show'),350));
};

window.goToStage1=function(){window.location.href='stage1.html';};

/* notif */
let _nt;
window.showNotif=function(m){const el=document.getElementById('notif');el.textContent=m;el.classList.add('show');clearTimeout(_nt);_nt=setTimeout(()=>el.classList.remove('show'),2800);};

/* DEV */
window.openDev=function(){const c=prompt('קוד DEV:');if(c===DEV_CODE)document.getElementById('dev-panel').classList.add('open');else if(c!==null)showNotif('קוד שגוי');};
window.closeDev=()=>document.getElementById('dev-panel').classList.remove('open');
window.devGo=function(id){
  closeDev();
  const pages=['stage1','stage2','stage3','stage4','puzzle','stage6'];
  if(pages.includes(id)){window.location.href=id+'.html';return;}
  if(id==='s-brief'){goTo('s-brief');typewrite(BRIEF_RAW,'brief-el',()=>document.getElementById('btn-brief-go').classList.add('show'));return;}
  if(id==='s-intro'){goTo('s-intro');return;}
  goTo(id,false);
};
window.devReset=function(){if(!confirm('איפוס מלא?'))return;closeDev();localStorage.clear();location.reload();};

/* INIT */
localStorage.removeItem('rm_state');
setTimeout(()=>{
  spawnFF(document.getElementById('s-curtain'),35);
  for(let i=0;i<18;i++){
    const f=document.createElement('div');f.className='ff';
    f.style.cssText=`width:3px;height:3px;left:${20+Math.random()*60}%;top:${15+Math.random()*70}%;`;
    f.style.setProperty('--tx',(Math.random()*55-27)+'px');
    f.style.setProperty('--ty',(Math.random()*38-19)+'px');
    f.style.animationDuration=(4+Math.random()*7)+'s';
    f.style.animationDelay=(Math.random()*4)+'s';
    document.getElementById('s-curtain').appendChild(f);
  }
  spawnFF(document.getElementById('s-intro'),18);
  spawnFF(document.getElementById('s-brief'),18);
  goTo('s-curtain',false);
},900);
</script>
</body>
</html>
