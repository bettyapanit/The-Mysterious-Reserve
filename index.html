<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>השמורה המסתורית</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Special+Elite&family=Rubik:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--jd:#0a1508;--gold:#c9a84c;--gold-l:#f0cc6e;--gold-d:#8a6820;--cream:#f5edd8;--dim:#a8c4aa;--gs:#00ff41;--gd:#00a82a;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:'Special Elite',serif;background:#000;color:var(--cream);}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .6s;z-index:10;}
.screen.active{opacity:1;pointer-events:all;}

/* FIXED UI */
.dev-btn-f{position:fixed;top:.6rem;left:.5rem;width:26px;height:26px;background:transparent;border:none;cursor:pointer;z-index:500;opacity:.08;font-size:13px;display:flex;align-items:center;justify-content:center;}
.dev-btn-f:hover{opacity:.4;}
.fs-btn{position:fixed;top:.6rem;left:2.2rem;background:rgba(0,0,0,.35);border:1px solid rgba(201,168,76,.3);color:rgba(201,168,76,.7);font-size:.9rem;width:26px;height:26px;border-radius:5px;cursor:pointer;z-index:500;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.fs-btn:hover{border-color:var(--gold);color:var(--gold);}
.back-btn{position:fixed;bottom:.8rem;right:.8rem;background:rgba(18,38,18,.9);border:1px solid rgba(45,106,48,.4);color:var(--dim);font-size:.8rem;padding:.35rem .85rem;border-radius:20px;cursor:pointer;z-index:100;font-family:'Rubik',sans-serif;display:none;}
.back-btn.vis{display:block;}
.back-btn:hover{border-color:var(--gold);color:var(--gold);}

/* LOADING */
#s-load{background:#000;text-align:center;gap:.9rem;}
.spinner{width:40px;height:40px;border:2px solid #142014;border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.load-txt{font-family:'Secular One',sans-serif;color:var(--gold);font-size:.9rem;}

/* CURTAIN — title INSIDE curtain, fades out on open */
#s-curtain{z-index:50;overflow:hidden;cursor:pointer;}
.curt-bg{position:absolute;inset:0;background:url('jungle.jpg') center/cover no-repeat;filter:brightness(.32) saturate(.6);transition:filter 1.8s ease;}
.curt-bg.reveal{filter:brightness(.95) saturate(1);}
.curt-r{position:absolute;top:0;right:0;bottom:0;width:65%;z-index:22;transform:translateX(0);transition:transform 1.9s cubic-bezier(.77,0,.18,1);}
.curt-r.open{transform:translateX(102%);}
.curt-l{position:absolute;top:0;left:0;bottom:0;width:65%;z-index:21;transform:translateX(0);transition:transform 1.9s cubic-bezier(.77,0,.18,1) .32s;}
.curt-l.open{transform:translateX(-102%);}
.curt-l img,.curt-r img{position:absolute;width:100%;height:100%;object-fit:cover;}
.curt-l img{object-position:left center;}
.curt-r img{object-position:right center;}
/* Title sits on top of branches, fades out when curtain opens */
.curt-title{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:30;text-align:center;pointer-events:none;transition:opacity 1s ease;}
.curt-title h1{font-family:'Secular One',sans-serif;font-size:clamp(2.2rem,8vw,5rem);white-space:nowrap;color:var(--cream);text-shadow:0 0 60px rgba(201,168,76,.95),0 0 120px rgba(201,168,76,.5),0 2px 30px rgba(0,0,0,.98);}
.curt-title.fadeout{opacity:0;}
.tap-hint{position:absolute;bottom:10%;left:50%;transform:translateX(-50%);z-index:35;font-family:'Rubik',sans-serif;font-size:clamp(.85rem,2.5vw,1.1rem);color:rgba(240,210,140,.8);letter-spacing:.2em;pointer-events:none;animation:phint 2.2s ease-in-out infinite;transition:opacity .4s;}
@keyframes phint{0%,100%{opacity:.4}50%{opacity:1}}

/* FIREFLIES */
.ff{position:absolute;border-radius:50%;background:var(--gold-l);box-shadow:0 0 5px 2px rgba(240,204,110,.4);animation:ffloat linear infinite;pointer-events:none;}
@keyframes ffloat{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}85%{opacity:.6}100%{opacity:0;transform:translate(var(--tx),var(--ty))}}

/* INTRO — no title, story only */
#s-intro{background:url('jungle.jpg') center/cover no-repeat;overflow-y:auto;justify-content:flex-start;align-items:center;}
#s-intro::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 8%,rgba(201,168,76,.12) 0%,transparent 50%);pointer-events:none;z-index:1;}
.intro-inner{position:relative;z-index:5;text-align:center;padding:2.5rem 1.4rem 2.5rem;max-width:740px;width:100%;display:flex;flex-direction:column;align-items:center;}
.intro-story{font-family:'Special Elite',serif;font-size:clamp(1.1rem,2.8vw,1.55rem);color:#fff;text-shadow:0 1px 14px rgba(0,0,0,.99),0 0 35px rgba(0,0,0,.95);line-height:1.7;margin-bottom:2rem;text-align:center;width:100%;}
.intro-story .sm{font-size:.75em;vertical-align:.06em;}
.tw-cursor{display:inline-block;width:2px;height:1em;background:var(--gold-l);vertical-align:middle;animation:blink .65s ease infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.btn-gold{font-family:'Rubik',sans-serif;font-weight:600;font-size:1.2rem;padding:.9rem 2.3rem;background:linear-gradient(135deg,var(--gold-d),var(--gold));color:var(--jd);border:none;border-radius:8px;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:0 4px 24px rgba(201,168,76,.45);}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(201,168,76,.65);}
.btn-start{opacity:0;transition:opacity .6s;}
.btn-start.show{opacity:1;}

/* NOTIF */
.notif{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-12px);background:rgba(50,10,10,.96);border:1px solid #c0392b;color:var(--cream);padding:.5rem 1.2rem;border-radius:30px;font-family:'Rubik',sans-serif;font-size:.95rem;z-index:300;opacity:0;transition:all .28s;pointer-events:none;white-space:nowrap;max-width:93vw;text-align:center;}
.notif.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* BRIEFING — same as intro but slightly brighter */
#s-brief{background:url('jungle.jpg') center/cover no-repeat;overflow-y:auto;justify-content:flex-start;align-items:center;}
#s-brief::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 8%,rgba(201,168,76,.12) 0%,transparent 50%),rgba(0,0,0,.45);pointer-events:none;z-index:1;}
/* Large heading inside briefing typewriter */
.story-big{font-size:1.4em;color:var(--gold-l);display:block;margin:.3em 0;text-shadow:0 0 30px rgba(201,168,76,.6);}

/* DEV PANEL */
.dev-panel{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.75rem;opacity:0;pointer-events:none;transition:opacity .3s;padding:2rem;}
.dev-panel.open{opacity:1;pointer-events:all;}
.dev-ttl{font-family:'Rubik',sans-serif;color:#0f0;font-size:1.2rem;}
.dev-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;width:100%;max-width:290px;}
.dev-bi{background:#080808;border:1px solid #1a1a1a;color:#0f0;font-family:monospace;font-size:.76rem;padding:.55rem;border-radius:5px;cursor:pointer;text-align:center;}
.dev-bi:hover{background:#0a160a;border-color:#0f0;}
.dev-close{background:transparent;border:1px solid #333;color:#555;font-size:.76rem;padding:.38rem 1.2rem;border-radius:5px;cursor:pointer;}
</style>
</head>
<body>

<button class="dev-btn-f" onclick="openDev()">🔧</button>
<button class="fs-btn" onclick="toggleFS()">⛶</button>
<button class="back-btn" id="back-btn" onclick="goBack()">→ חזרה</button>

<!-- LOADING -->
<div class="screen active" id="s-load">
  <div class="spinner"></div>
  <div class="load-txt">טוען את השמורה...</div>
</div>

<!-- CURTAIN — title visible, fades out on open -->
<div class="screen" id="s-curtain" onclick="openCurtain()">
  <div class="curt-bg" id="curt-bg"></div>
  <div class="curt-r" id="cr"><img src="branches_right.png" alt=""></div>
  <div class="curt-l" id="cl"><img src="branches_left.png" alt=""></div>
  <div class="curt-title" id="curt-title"><h1>השמורה המסתורית</h1></div>
  <div class="tap-hint" id="tap-hint">לחצו לכניסה לשמורה</div>
</div>

<!-- INTRO — story typewriter, same background throughout -->
<div class="screen" id="s-intro">
  <div class="intro-inner">
    <div class="intro-story" id="story-el"></div>
    <button class="btn-gold btn-start" id="btn-start" onclick="startBriefing()">התחילו בחקירה</button>
  </div>
</div>

<!-- BRIEFING — same background, second typewriter -->
<div class="screen" id="s-brief">
  <div class="intro-inner">
    <div class="intro-story" id="brief-el"></div>
    <button class="btn-gold btn-start" id="btn-brief-go" onclick="goToStage1()">אל זירת הפשע</button>
  </div>
</div>

<div class="notif" id="notif"></div>

<div class="dev-panel" id="dev-panel">
  <div class="dev-ttl">DEV MODE</div>
  <div class="dev-grid">
    <div class="dev-bi" onclick="devSkipTo('s-intro')">סיפור</div>
    <div class="dev-bi" onclick="devSkipTo('s-brief')">ברייפינג</div>
    <div class="dev-bi" onclick="devSkipTo('stage1')">שלב 1</div>
    <div class="dev-bi" onclick="devReset()">איפוס</div>
  </div>
  <button class="dev-close" onclick="closeDev()">סגור</button>
</div>

<script type="module">
const DEV_CODE = '7763';
let state={};
let screenHistory=[], curtainOpened=false;
const save=()=>localStorage.setItem('rm_state',JSON.stringify(state));
const load=()=>{try{const s=localStorage.getItem('rm_state');if(s)state={...state,...JSON.parse(s)};}catch(e){}};

window.toggleFS=function(){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen();};

function spawnFF(container,count){
  for(let i=0;i<count;i++){
    const ff=document.createElement('div');ff.className='ff';ff.style.width='3px';ff.style.height='3px';
    ff.style.left=Math.random()*100+'%';ff.style.top=Math.random()*90+'%';
    ff.style.setProperty('--tx',(Math.random()*100-50)+'px');
    ff.style.setProperty('--ty',(Math.random()*60-30)+'px');
    ff.style.animationDuration=(6+Math.random()*10)+'s';
    ff.style.animationDelay=(Math.random()*7)+'s';
    container.appendChild(ff);
  }
}

// NAVIGATION
window.goTo=function(id,hist=true){
  if(hist&&!['s-load','s-curtain'].includes(id)){
    const cur=document.querySelector('.screen.active');
    if(cur&&cur.id!==id) screenHistory.push(cur.id);
  }
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById('back-btn').className='back-btn'+(screenHistory.length?' vis':'');
  if(id==='s-intro') setTimeout(startTypewriter,400);
};
window.goBack=function(){if(!screenHistory.length)return;goTo(screenHistory.pop(),false);};

// CURTAIN — title fades, then transition to story
window.openCurtain=function(){
  if(curtainOpened)return;curtainOpened=true;
  document.getElementById('tap-hint').style.opacity='0';
  document.getElementById('curt-bg').classList.add('reveal');
  document.getElementById('cr').classList.add('open');
  setTimeout(()=>document.getElementById('cl').classList.add('open'),320);
  // Title fades out as branches open
  setTimeout(()=>document.getElementById('curt-title').classList.add('fadeout'),300);
  setTimeout(()=>goTo('s-intro'),2600);
};

// TYPEWRITER engine
const STORY_RAW='אתמול בלילה<C> תחת אור הירח<C> נגנבה מפת האוצרות העתיקה של שמורת עדן הסודית<P> המפה מובילה אל מיקומי האוצרות הטמונים ברחבי השמורה<C> ביניהם האבן הקסומה שמגינה על השמורה<P> מפת האוצרות הוסתרה במקום סודי בלב השמורה - מקום שרק פקח השמורה יודע עליו<P>\n\nהבוקר גילה הפקח שהמפה נגנבה<C> והוא צריך את עזרתם של צוות בלשים צעירים ומבריקים כדי לפתור את התעלומה - להבין מי מהחיות גנב את המפה ואיך<C> ולהשיב אותה אל פקח השמורה<P>\n\nהבלשית יובל<C> מוכנה לגייס צוות בלשים כדי לעבוד איתך על החקירה המסתורית<Q>';

const BRIEF_RAW='יובל וצוות הבלשים המבריקים<P>\n\n<BIG>ברוכים הבאים לשמורת עדן הסודית!</BIG>\n\nהשמורה ואוצרותיה בסכנה! הגנב עלול לפצח את המפה ולהגיע ממש בקרוב אל אוצרות השמורה ואפילו אל האבן הקסומה שמגינה עליה<P>\n\nהחקירה הזו תלויה בכם בלבד<P> יש לכם <B>60 דקות</B> כדי לתפוס את הגנב<C> להחזיר את מפת האוצרות העתיקה לפקח השמורה ולהשיב את הביטחון לכל דיירי השמורה<P>\n\nמוכנים<Q> הזמן שלכם מתחיל לרוץ<P>';

function proc(r){
  return r
    .replace(/<C>/g,'<span class="sm">,</span>')
    .replace(/<P>/g,'<span class="sm">.</span>')
    .replace(/<Q>/g,'<span class="sm">?</span>')
    .replace(/<BIG>(.*?)<\/BIG>/g,'<span class="story-big">$1</span>')
    .replace(/<B>(.*?)<\/B>/g,'<strong style="color:var(--gold-l)">$1</strong>');
}
function rawIdx(raw,ts){
  let s=0,r=0;
  const tags=['<C>','<P>','<Q>','<BIG>','</BIG>','<B>','</B>'];
  while(r<raw.length&&s<ts){
    let f=false;
    for(const t of tags){
      if(raw.startsWith(t,r)){
        if(t==='<BIG>'||t==='</BIG>'||t==='<B>'||t==='</B>') r+=t.length;
        else{s+=1;r+=t.length;}
        f=true;break;
      }
    }
    if(!f){s++;r++;}
  }
  return r;
}

function typewrite(raw,elId,onDone){
  const el=document.getElementById(elId);
  el.innerHTML='';
  const stripped=raw.replace(/<C>/g,',').replace(/<P>/g,'.').replace(/<Q>/g,'?').replace(/<\/?(?:BIG|B)>/g,'');
  const chars=stripped.split('');let i=0;
  function next(){
    if(i>=chars.length){
      el.innerHTML=proc(raw).replace(/\n/g,'<br>');
      onDone();return;
    }
    const ch=chars[i];
    el.innerHTML=proc(raw.slice(0,rawIdx(raw,i+1))).replace(/\n/g,'<br>')+'<span class="tw-cursor"></span>';
    const scr=el.closest('.screen');if(scr)scr.scrollTop=scr.scrollHeight;
    i++;
    const d=ch==='.'||ch==='?'?420:ch===','?180:ch==='\n'?700:ch===' '?55:38+Math.random()*22;
    setTimeout(next,d);
  }
  setTimeout(next,200);
}

function startTypewriter(){
  typewrite(STORY_RAW,'story-el',()=>{
    setTimeout(()=>document.getElementById('btn-start').classList.add('show'),400);
  });
}

window.startBriefing=function(){
  document.getElementById('btn-start').classList.remove('show');
  goTo('s-brief');
  typewrite(BRIEF_RAW,'brief-el',()=>{
    setTimeout(()=>document.getElementById('btn-brief-go').classList.add('show'),400);
  });
};

window.goToStage1=function(){
  localStorage.removeItem('rm_state');
  window.location.href='stage1.html';
};

let nt;
window.showNotif=function(msg){const el=document.getElementById('notif');el.textContent=msg;el.classList.add('show');clearTimeout(nt);nt=setTimeout(()=>el.classList.remove('show'),3000);};

window.openDev=function(){const c=prompt('קוד:');if(c===DEV_CODE)document.getElementById('dev-panel').classList.add('open');else if(c!==null)showNotif('קוד שגוי');};
window.closeDev=()=>document.getElementById('dev-panel').classList.remove('open');
window.devSkipTo=function(id){
  closeDev();
  if(id==='stage1'){window.location.href='stage1.html';return;}
  if(id==='s-brief'){goTo('s-brief');typewrite(BRIEF_RAW,'brief-el',()=>document.getElementById('btn-brief-go').classList.add('show'));return;}
  goTo(id);
};
window.devReset=function(){
  if(!confirm('איפוס מלא?'))return;closeDev();
  localStorage.clear();location.reload();
};

// INIT
// index.html always clears saved state — fresh start every time
localStorage.removeItem('rm_state');
load();
setTimeout(()=>{
  spawnFF(document.getElementById('s-curtain'),35);
  for(let i=0;i<20;i++){
    const ff=document.createElement('div');ff.className='ff';ff.style.width='3px';ff.style.height='3px';
    ff.style.left=(25+Math.random()*50)+'%';ff.style.top=(20+Math.random()*60)+'%';
    ff.style.setProperty('--tx',(Math.random()*60-30)+'px');
    ff.style.setProperty('--ty',(Math.random()*40-20)+'px');
    ff.style.animationDuration=(5+Math.random()*8)+'s';
    ff.style.animationDelay=(Math.random()*5)+'s';
    document.getElementById('s-curtain').appendChild(ff);
  }
  spawnFF(document.getElementById('s-intro'),22);
  spawnFF(document.getElementById('s-brief'),22);
  goTo('s-curtain',false);
},1000);
</script>
</body>
</html>
