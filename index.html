<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>השמורה המסתורית</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Special+Elite&family=Rubik:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#c9a84c;--gold-l:#f0cc6e;--gold-d:#8a6820;--jd:#0a1508;--cream:#f5edd8;--dim:#a8c4aa;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;background:#000;color:var(--cream);}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .5s;z-index:10;}
.screen.active{opacity:1;pointer-events:all;}

/* ── fixed chrome — identical across ALL screens ── */
#chrome{position:fixed;top:0;left:0;right:0;height:2.6rem;z-index:500;display:flex;align-items:center;padding:0 .5rem;gap:.4rem;pointer-events:none;}
#chrome>*{pointer-events:all;}
.ch-btn{width:28px;height:28px;background:rgba(0,0,0,.45);border:1px solid rgba(201,168,76,.28);color:rgba(201,168,76,.65);font-size:.85rem;border-radius:5px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;}
.ch-btn:hover{border-color:var(--gold);color:var(--gold);}
.ch-back{font-size:.75rem;padding:0 .55rem;width:auto;display:none;}
.ch-back.vis{display:flex;}

/* loading */
#s-load{background:#000;gap:.8rem;}
.spinner{width:36px;height:36px;border:2px solid #142014;border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.load-txt{font-family:'Secular One',sans-serif;color:var(--gold);font-size:.85rem;}

/* curtain */
#s-curtain{z-index:50;overflow:hidden;cursor:pointer;}
.curt-bg{position:absolute;inset:0;background:url('jungle.jpg') center/cover no-repeat;filter:brightness(.3) saturate(.55);transition:filter 1.8s ease;}
.curt-bg.reveal{filter:brightness(.9) saturate(1);}
.curt-r{position:absolute;top:0;right:0;bottom:0;width:65%;z-index:22;transition:transform 1.9s cubic-bezier(.77,0,.18,1);}
.curt-r.open{transform:translateX(102%);}
.curt-l{position:absolute;top:0;left:0;bottom:0;width:65%;z-index:21;transition:transform 1.9s cubic-bezier(.77,0,.18,1) .3s;}
.curt-l.open{transform:translateX(-102%);}
.curt-l img,.curt-r img{position:absolute;width:100%;height:100%;object-fit:cover;}
.curt-l img{object-position:left center;}
.curt-r img{object-position:right center;}
.curt-title{position:absolute;top:50%;left:50%;transform:translate(-50%,-52%);z-index:30;text-align:center;pointer-events:none;transition:opacity .2s ease;}
.curt-title h1{font-family:'Secular One',sans-serif;font-size:clamp(2.4rem,8vw,5rem);white-space:nowrap;color:var(--cream);text-shadow:0 0 60px rgba(201,168,76,.95),0 0 120px rgba(201,168,76,.45),0 2px 30px rgba(0,0,0,.98);}
.curt-title.fadeout{opacity:0;}
.tap-hint{position:absolute;bottom:9%;left:50%;transform:translateX(-50%);z-index:35;font-family:'Rubik',sans-serif;font-size:clamp(.9rem,2vw,1.1rem);color:rgba(240,210,140,.8);letter-spacing:.18em;pointer-events:none;animation:phint 2s ease-in-out infinite;transition:opacity .12s;}
.tap-hint.gone{opacity:0!important;animation:none;}
@keyframes phint{0%,100%{opacity:.35}50%{opacity:1}}
.ff{position:absolute;border-radius:50%;background:var(--gold-l);box-shadow:0 0 5px 2px rgba(240,204,110,.4);animation:ffloat linear infinite;pointer-events:none;}
@keyframes ffloat{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}85%{opacity:.6}100%{opacity:0;transform:translate(var(--tx),var(--ty))}}

/* story screens — same dark overlay */
#s-intro,#s-brief{background:url('jungle.jpg') center/cover no-repeat;}
#s-intro::before,#s-brief::before{content:'';position:fixed;inset:0;background:rgba(0,0,0,.58);pointer-events:none;z-index:1;}
.story-inner{position:relative;z-index:5;width:100%;max-width:860px;padding:3.2rem 3vw 2.5rem;display:flex;flex-direction:column;align-items:center;gap:2.5vh;height:100%;justify-content:center;}
.story-txt{font-family:'Special Elite',serif;color:#fff;text-shadow:0 1px 12px rgba(0,0,0,.98);line-height:1.8;text-align:center;width:100%;font-size:clamp(1.35rem,2.9vh,2.1rem);}
.story-txt .sm{font-size:.78em;vertical-align:.05em;}
.tw-cursor{display:inline-block;width:2px;height:.9em;background:var(--gold-l);vertical-align:middle;animation:blink .65s ease infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
/* BIG heading — enters already yellow+bold from first char */
.story-big{font-size:1.45em;font-weight:700;color:var(--gold-l);display:inline;text-shadow:0 0 28px rgba(201,168,76,.6);}

.btn-gold{font-family:'Rubik',sans-serif;font-weight:600;font-size:clamp(1rem,1.9vh,1.3rem);padding:.8rem 2.2rem;background:linear-gradient(135deg,var(--gold-d),var(--gold));color:var(--jd);border:none;border-radius:8px;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:0 4px 22px rgba(201,168,76,.4);flex-shrink:0;}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 7px 28px rgba(201,168,76,.6);}
.btn-start{opacity:0;transition:opacity .5s;pointer-events:none;}
.btn-start.show{opacity:1;pointer-events:all;}

/* notif */
.notif{position:fixed;top:3rem;left:50%;transform:translateX(-50%) translateY(-10px);background:rgba(40,8,8,.96);border:1px solid #a93226;color:var(--cream);padding:.4rem 1rem;border-radius:26px;font-family:'Rubik',sans-serif;font-size:.88rem;z-index:600;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;max-width:92vw;text-align:center;}
.notif.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* dev panel */
.dev-panel{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.55rem;opacity:0;pointer-events:none;transition:opacity .25s;padding:1.5rem;}
.dev-panel.open{opacity:1;pointer-events:all;}
.dev-ttl{font-family:'Rubik',sans-serif;color:#0f0;font-size:1rem;margin-bottom:.3rem;}
.dev-grid{display:grid;grid-template-columns:1fr 1fr;gap:.42rem;width:100%;max-width:310px;}
.dev-bi{background:#060d06;border:1px solid #1a2a1a;color:#0f0;font-family:monospace;font-size:.76rem;padding:.52rem .3rem;border-radius:5px;cursor:pointer;text-align:center;}
.dev-bi:hover{background:#0b1a0b;border-color:#0f0;}
.dev-bi.red{color:#f66;border-color:#3a1010;}
.dev-bi.red:hover{background:#180a0a;border-color:#f66;}
.dev-close{background:transparent;border:1px solid #222;color:#444;font-size:.73rem;padding:.32rem 1rem;border-radius:5px;cursor:pointer;margin-top:.2rem;}
</style>
</head>
<body>

<!-- fixed chrome — always visible -->
<div id="chrome">
  <button class="ch-btn" id="ch-dev" onclick="openDev()" title="DEV">🔧</button>
  <button class="ch-btn" id="ch-fs" onclick="toggleFS()" title="מסך מלא">⛶</button>
  <button class="ch-btn ch-back" id="ch-back" onclick="goBack()">← חזרה</button>
</div>

<!-- loading -->
<div class="screen active" id="s-load">
  <div class="spinner"></div>
  <div class="load-txt">טוען את השמורה...</div>
</div>

<!-- מסך הכניסה -->
<div class="screen" id="s-curtain" onclick="openCurtain()">
  <div class="curt-bg" id="curt-bg"></div>
  <div class="curt-r" id="cr"><img src="branches_right.png" alt=""></div>
  <div class="curt-l" id="cl"><img src="branches_left.png" alt=""></div>
  <div class="curt-title" id="curt-title"><h1>השמורה המסתורית</h1></div>
  <div class="tap-hint" id="tap-hint">לחצו לכניסה לשמורה</div>
</div>

<!-- מסך הפתיחה -->
<div class="screen" id="s-intro">
  <div class="story-inner">
    <div class="story-txt" id="story-el"></div>
    <button class="btn-gold btn-start" id="btn-start" onclick="startBriefing()">התחילו בחקירה</button>
  </div>
</div>

<!-- מסך ברוכים הבאים -->
<div class="screen" id="s-brief">
  <div class="story-inner">
    <div class="story-txt" id="brief-el"></div>
    <button class="btn-gold btn-start" id="btn-brief-go" onclick="goToStage1()">אל זירת הפשע</button>
  </div>
</div>

<div class="notif" id="notif"></div>

<div class="dev-panel" id="dev-panel">
  <div class="dev-ttl">⚙ DEV MODE — השמורה המסתורית</div>
  <div class="dev-grid">
    <div class="dev-bi" onclick="devGo('s-curtain')">מסך כניסה</div>
    <div class="dev-bi" onclick="devGo('s-intro')">מסך פתיחה</div>
    <div class="dev-bi" onclick="devGo('s-brief')">ברוכים הבאים</div>
    <div class="dev-bi" onclick="devGo('stage1')">זירת הפשע</div>
    <div class="dev-bi" onclick="devGo('stage2')">עדות אנונימית</div>
    <div class="dev-bi" onclick="devGo('stage3')">ספר פרופילים</div>
    <div class="dev-bi" onclick="devGo('stage4')">האשמה</div>
    <div class="dev-bi" onclick="devGo('puzzle')">פאזל מפה</div>
    <div class="dev-bi" onclick="devGo('stage6')">פתיחת קוד</div>
    <div class="dev-bi red" style="grid-column:1/-1" onclick="devReset()">איפוס מלא ↺</div>
  </div>
  <button class="dev-close" onclick="closeDev()">✕ סגור</button>
</div>

<script>
const DEV_CODE='7763';
let hist=[], curtainOpened=false;

window.toggleFS=function(){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen();};

function spawnFF(el,n){for(let i=0;i<n;i++){const f=document.createElement('div');f.className='ff';f.style.cssText=`width:3px;height:3px;left:${Math.random()*100}%;top:${Math.random()*88}%;`;f.style.setProperty('--tx',(Math.random()*90-45)+'px');f.style.setProperty('--ty',(Math.random()*55-27)+'px');f.style.animationDuration=(6+Math.random()*10)+'s';f.style.animationDelay=(Math.random()*7)+'s';el.appendChild(f);}}

window.goTo=function(id,h=true){
  if(h&&!['s-load','s-curtain'].includes(id)){const cur=document.querySelector('.screen.active');if(cur&&cur.id!==id)hist.push(cur.id);}
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById('ch-back').className='ch-btn ch-back'+(hist.length?' vis':'');
  if(id==='s-intro')setTimeout(startTypewriter,350);
};
window.goBack=function(){if(!hist.length)return;goTo(hist.pop(),false);};

window.openCurtain=function(){
  if(curtainOpened)return;curtainOpened=true;
  document.getElementById('tap-hint').classList.add('gone');
  document.getElementById('curt-bg').classList.add('reveal');
  document.getElementById('cr').classList.add('open');
  setTimeout(()=>document.getElementById('cl').classList.add('open'),300);
  setTimeout(()=>document.getElementById('curt-title').classList.add('fadeout'),220);
  setTimeout(()=>goTo('s-intro'),2500);
};

/* TYPEWRITER */
const STORY_RAW='אתמול בלילה<C> תחת אור הירח<C> נגנבה מפת האוצרות העתיקה של שמורת עדן הסודית<P> המפה מובילה אל מיקומי האוצרות הטמונים ברחבי השמורה<C> ביניהם האבן הקסומה שמגינה על השמורה<P> מפת האוצרות הוסתרה במקום סודי בלב השמורה - מקום שרק פקח השמורה יודע עליו<P>\n\nבסיור הערב השגרתי פקח השמורה עבר באזור מקום המחבוא הסודי של המפה העתיקה וגילה שאחת החיות בשמורה חפרה בור בדיוק במקום בו המפה היתה טמונה וגנבה אותה<P> ככל הנראה<C> הפשע התבצע אתמול בלילה<P> כלומר<C> עברו כבר הרבה שעות מאז שהגנב הצליח לחמוק עם המפה הסודית<P> כל דקה שעוברת נותנת לו יתרון ומקטינה את הסיכויים לתפוס אותו ולהציל את האוצרות ואת השמורה<P>\n\nהפקח החליט להזעיק עוד הלילה עזרה דחופה<P> הוא צריך את עזרתם של צוות בלשים צעירים ומבריקים כדי לפתור את התעלומה - להבין מי מהחיות גנב את המפה ואיך<C> ולהשיב אותה אל פקח השמורה<P>\n\nהבלשית יובל<C> מוכנה לגייס צוות בלשים כדי לעבוד איתך על החקירה המסתורית<Q>';

const BRIEF_RAW='יובל וצוות הבלשים המבריקים<C>\n\n<BIG>ברוכים הבאים לשמורת עדן הסודית!</BIG>\n\nהשמורה ואוצרותיה בסכנה<P> הגנב עלול לפצח את המפה ולהגיע ממש בקרוב אל אוצרות השמורה ואפילו אל האבן הקסומה שמגינה עליה<P>\n\nהחקירה הזו תלויה בכם בלבד<P> יש לכם <B>60 דקות</B> כדי לתפוס את הגנב<C> להחזיר את מפת האוצרות העתיקה אל פקח השמורה ולהשיב את הביטחון לכל דיירי השמורה<P>\n\nמוכנים<Q> התחילו מביקור בזירת הפשע<P>\nהזמן שלכם מתחיל לרוץ<P>';

function proc(r){
  return r
    .replace(/<C>/g,'<span class="sm">,</span>')
    .replace(/<P>/g,'<span class="sm">.</span>')
    .replace(/<Q>/g,'<span class="sm">?</span>')
    .replace(/<BIG>([\s\S]*?)<\/BIG>/g,'<span class="story-big">$1</span>')
    .replace(/<B>([\s\S]*?)<\/B>/g,'<strong style="color:var(--gold-l)">$1</strong>');
}
function rawIdx(raw,ts){
  let s=0,r=0;
  const skip=['<BIG>','</BIG>','<B>','</B>'];
  const count=['<C>','<P>','<Q>'];
  while(r<raw.length&&s<ts){
    let f=false;
    for(const t of skip){if(raw.startsWith(t,r)){r+=t.length;f=true;break;}}
    if(f)continue;
    for(const t of count){if(raw.startsWith(t,r)){s++;r+=t.length;f=true;break;}}
    if(!f){s++;r++;}
  }
  return r;
}
function typewrite(raw,elId,onDone){
  const el=document.getElementById(elId);el.innerHTML='';
  const stripped=raw.replace(/<[^>]+>/g,'');
  let i=0;
  function next(){
    if(i>=stripped.length){el.innerHTML=proc(raw).replace(/\n/g,'<br>');onDone();return;}
    el.innerHTML=proc(raw.slice(0,rawIdx(raw,i+1))).replace(/\n/g,'<br>')+'<span class="tw-cursor"></span>';
    const ch=stripped[i++];
    const d=ch==='.'||ch==='?'?390:ch===','?155:ch==='\n'?620:ch===' '?48:33+Math.random()*18;
    setTimeout(next,d);
  }
  setTimeout(next,160);
}
function startTypewriter(){typewrite(STORY_RAW,'story-el',()=>setTimeout(()=>document.getElementById('btn-start').classList.add('show'),300));}
window.startBriefing=function(){document.getElementById('btn-start').classList.remove('show');goTo('s-brief');typewrite(BRIEF_RAW,'brief-el',()=>setTimeout(()=>document.getElementById('btn-brief-go').classList.add('show'),300));};
window.goToStage1=function(){localStorage.removeItem('rm_state');window.location.href='stage1.html';};

let _nt;
window.showNotif=function(m){const el=document.getElementById('notif');el.textContent=m;el.classList.add('show');clearTimeout(_nt);_nt=setTimeout(()=>el.classList.remove('show'),2800);};

window.openDev=function(){const c=prompt('קוד DEV:');if(c===DEV_CODE)document.getElementById('dev-panel').classList.add('open');else if(c!==null)showNotif('קוד שגוי');};
window.closeDev=()=>document.getElementById('dev-panel').classList.remove('open');
window.devGo=function(id){closeDev();const pages=['stage1','stage2','stage3','stage4','puzzle','stage6'];if(pages.includes(id)){window.location.href=id+'.html';return;}if(id==='s-brief'){goTo('s-brief');typewrite(BRIEF_RAW,'brief-el',()=>document.getElementById('btn-brief-go').classList.add('show'));return;}goTo(id,false);};
window.devReset=function(){if(!confirm('איפוס מלא?'))return;closeDev();localStorage.clear();location.reload();};

localStorage.removeItem('rm_state');
setTimeout(()=>{
  spawnFF(document.getElementById('s-curtain'),35);
  for(let i=0;i<18;i++){const f=document.createElement('div');f.className='ff';f.style.cssText=`width:3px;height:3px;left:${20+Math.random()*60}%;top:${15+Math.random()*70}%;`;f.style.setProperty('--tx',(Math.random()*55-27)+'px');f.style.setProperty('--ty',(Math.random()*38-19)+'px');f.style.animationDuration=(4+Math.random()*7)+'s';f.style.animationDelay=(Math.random()*4)+'s';document.getElementById('s-curtain').appendChild(f);}
  spawnFF(document.getElementById('s-intro'),16);
  spawnFF(document.getElementById('s-brief'),16);
  goTo('s-curtain',false);
},900);
</script>
</body>
</html>
