<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>זירת הפשע</title>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Special+Elite&family=Rubik:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#c9a84c;--gold-l:#f0cc6e;--gold-d:#8a6820;--jd:#0a1508;--cream:#f5edd8;--dim:#a8c4aa;--dark:#060e06;--border:rgba(201,168,76,.22);}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;background:var(--dark);color:var(--cream);font-family:'Rubik',sans-serif;}

/* LAYOUT */
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden;}

/* HEADER */
.hdr{background:rgba(4,10,4,.95);border-bottom:1px solid var(--border);padding:.4rem 1rem;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:10;}
.hdr-title{font-family:'Secular One',sans-serif;font-size:clamp(.95rem,2.5vw,1.3rem);color:var(--gold);letter-spacing:.04em;}
.hdr-right{display:flex;gap:.5rem;align-items:center;}
.hdr-btn{background:rgba(0,0,0,.3);border:1px solid var(--border);color:var(--dim);font-size:.72rem;padding:.25rem .6rem;border-radius:14px;cursor:pointer;font-family:'Rubik',sans-serif;transition:all .2s;}
.hdr-btn:hover{border-color:var(--gold);color:var(--gold);}
.hdr-left{display:flex;gap:.5rem;align-items:center;}
.dev-btn{background:transparent;border:none;cursor:pointer;opacity:.08;font-size:13px;padding:.2rem;}
.dev-btn:hover{opacity:.4;}

/* MAIN */
.main{flex:1;position:relative;overflow:hidden;}
.bg-img{position:absolute;inset:0;background:url('crime_scene.jpg') center/cover no-repeat;filter:brightness(.35) saturate(.7);}

/* OVERLAY PANEL */
.ov{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.7);opacity:0;pointer-events:none;transition:opacity .4s;padding:1rem;}
.ov.show{opacity:1;pointer-events:all;}
.ov-box{background:rgba(6,18,6,.96);border:1px solid var(--border);border-radius:14px;max-width:640px;width:100%;max-height:88vh;overflow-y:auto;padding:1.8rem 2rem;box-shadow:0 0 60px rgba(0,0,0,.8);position:relative;}
.ov-title{font-family:'Secular One',sans-serif;font-size:clamp(1.1rem,3vw,1.5rem);color:var(--gold);margin-bottom:.9rem;text-align:center;}
.ov-body{font-family:'Special Elite',serif;font-size:clamp(.95rem,2.2vw,1.15rem);color:var(--cream);line-height:1.85;text-align:center;}
.ov-body p{margin-bottom:.7rem;}
.ov-body strong{color:var(--gold-l);}
.ov-close{margin-top:1.3rem;display:flex;justify-content:center;}
.btn-gold{font-family:'Rubik',sans-serif;font-weight:600;font-size:1rem;padding:.75rem 2rem;background:linear-gradient(135deg,var(--gold-d),var(--gold));color:var(--jd);border:none;border-radius:8px;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:0 4px 20px rgba(201,168,76,.4);}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 7px 28px rgba(201,168,76,.6);}
.btn-outline{font-family:'Rubik',sans-serif;font-weight:400;font-size:.9rem;padding:.55rem 1.4rem;background:transparent;border:1px solid var(--border);color:var(--dim);border-radius:8px;cursor:pointer;transition:all .2s;margin-top:.5rem;}
.btn-outline:hover{border-color:var(--gold);color:var(--gold);}

/* EVIDENCE GRID */
.ev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:.7rem;margin:1rem 0;}
.ev-item{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:8px;padding:.5rem;text-align:center;cursor:pointer;transition:all .2s;}
.ev-item:hover{border-color:var(--gold);background:rgba(201,168,76,.08);}
.ev-item img{width:100%;aspect-ratio:1;object-fit:contain;margin-bottom:.3rem;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));}
.ev-item span{font-size:.72rem;color:var(--dim);display:block;line-height:1.3;}

/* FOOTPRINT MATCH stage */
.match-wrap{display:flex;flex:1;overflow:hidden;gap:0;}
/* left: animals */
.col-animals{width:52%;background:rgba(3,9,3,.9);border-left:1px solid var(--border);overflow-y:auto;padding:.5rem;}
.col-clues{width:48%;background:rgba(6,14,6,.9);overflow-y:auto;padding:.5rem;}
.col-hdr{font-family:'Secular One',sans-serif;font-size:.8rem;color:var(--gold);padding:.3rem .4rem .5rem;text-align:center;letter-spacing:.05em;border-bottom:1px solid var(--border);margin-bottom:.4rem;}

/* animal cards in match */
.animal-row{display:flex;align-items:center;gap:.5rem;padding:.35rem .4rem;border:1px solid transparent;border-radius:7px;margin-bottom:.3rem;cursor:pointer;transition:all .2s;position:relative;}
.animal-row:hover{background:rgba(201,168,76,.07);border-color:var(--border);}
.animal-row.matched{background:rgba(0,180,80,.08);border-color:rgba(0,200,80,.3);}
.animal-row img{width:38px;height:38px;object-fit:contain;flex-shrink:0;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6));}
.animal-name{font-size:.82rem;color:var(--cream);flex:1;}
.animal-clue-slot{width:34px;height:34px;border:1px dashed rgba(201,168,76,.3);border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:rgba(0,0,0,.2);}
.animal-clue-slot img{width:30px;height:30px;object-fit:contain;}
.animal-clue-slot.filled{border-color:rgba(0,200,80,.4);background:rgba(0,180,80,.07);}

/* clue cards */
.clue-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;}
.clue-card{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:6px;padding:.4rem;text-align:center;cursor:pointer;transition:all .2s;position:relative;}
.clue-card:hover{border-color:var(--gold-l);background:rgba(201,168,76,.1);}
.clue-card.selected{border-color:var(--gold);background:rgba(201,168,76,.18);box-shadow:0 0 10px rgba(201,168,76,.3);}
.clue-card.used{opacity:.35;pointer-events:none;}
.clue-card img{width:100%;aspect-ratio:1;object-fit:contain;}
.clue-num{font-size:.65rem;color:var(--dim);margin-top:.2rem;}

/* footer */
.footer{background:rgba(4,10,4,.95);border-top:1px solid var(--border);padding:.45rem 1rem;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.footer-info{font-size:.75rem;color:var(--dim);}
.progress{font-size:.8rem;color:var(--gold);font-weight:600;}

/* back btn */
.back-btn{position:fixed;bottom:.7rem;right:.7rem;background:rgba(10,21,10,.9);border:1px solid rgba(45,106,48,.35);color:var(--dim);font-size:.78rem;padding:.3rem .8rem;border-radius:20px;cursor:pointer;z-index:200;font-family:'Rubik',sans-serif;transition:all .2s;}
.back-btn:hover{border-color:var(--gold);color:var(--gold);}

/* notif */
.notif{position:fixed;top:3.2rem;left:50%;transform:translateX(-50%) translateY(-10px);background:rgba(40,8,8,.96);border:1px solid #a93226;color:var(--cream);padding:.4rem 1rem;border-radius:26px;font-size:.85rem;z-index:400;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;max-width:92vw;text-align:center;}
.notif.show{opacity:1;transform:translateX(-50%) translateY(0);}
.notif.ok{background:rgba(8,40,8,.96);border-color:#2a8a2a;color:#9fefaf;}

/* dev panel */
.dev-panel{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.55rem;opacity:0;pointer-events:none;transition:opacity .25s;padding:1.5rem;}
.dev-panel.open{opacity:1;pointer-events:all;}
.dev-ttl{font-family:'Rubik',sans-serif;color:#0f0;font-size:1rem;margin-bottom:.3rem;}
.dev-grid{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;width:100%;max-width:310px;}
.dev-bi{background:#060d06;border:1px solid #1a2a1a;color:#0f0;font-family:monospace;font-size:.75rem;padding:.5rem .3rem;border-radius:5px;cursor:pointer;text-align:center;}
.dev-bi:hover{background:#0a180a;border-color:#0f0;}
.dev-bi.red{color:#f55;border-color:#3a1010;}
.dev-bi.red:hover{background:#180a0a;border-color:#f55;}
.dev-close{background:transparent;border:1px solid #222;color:#444;font-size:.73rem;padding:.32rem 1rem;border-radius:5px;cursor:pointer;margin-top:.2rem;}

/* instructions overlay */
.inst-ov{position:fixed;inset:0;z-index:110;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:1rem;opacity:0;pointer-events:none;transition:opacity .3s;}
.inst-ov.show{opacity:1;pointer-events:all;}
.inst-box{background:rgba(6,18,6,.97);border:1px solid var(--border);border-radius:12px;max-width:480px;width:100%;padding:1.5rem 1.8rem;}
.inst-title{font-family:'Secular One',sans-serif;color:var(--gold);font-size:1.1rem;margin-bottom:.8rem;text-align:center;}
.inst-body{font-family:'Rubik',sans-serif;font-size:.92rem;color:var(--cream);line-height:1.85;}
.inst-body li{margin-bottom:.4rem;}
</style>
</head>
<body>

<div class="app" id="app">
  <div class="hdr">
    <div class="hdr-left">
      <button class="dev-btn" onclick="openDev()">🔧</button>
    </div>
    <div class="hdr-title" id="hdr-title">זירת הפשע</div>
    <div class="hdr-right">
      <button class="hdr-btn" onclick="showInst()">הוראות ℹ</button>
      <button class="hdr-btn" onclick="history.back()">← חזרה</button>
    </div>
  </div>

  <div class="main" id="main">
    <div class="bg-img"></div>
    <!-- content injected by JS -->
  </div>

  <div class="footer">
    <div class="footer-info" id="footer-info">זירת הפשע — שמורת עדן הסודית</div>
    <div class="progress" id="progress-txt"></div>
  </div>
</div>

<!-- OVERLAY for popup panels -->
<div class="ov" id="ov">
  <div class="ov-box" id="ov-box"></div>
</div>

<!-- INSTRUCTIONS -->
<div class="inst-ov" id="inst-ov">
  <div class="inst-box">
    <div class="inst-title" id="inst-title">הוראות</div>
    <div class="inst-body" id="inst-body"></div>
    <div style="text-align:center;margin-top:1rem">
      <button class="btn-outline" onclick="closeInst()">הבנתי ✓</button>
    </div>
  </div>
</div>

<div class="notif" id="notif"></div>

<div class="dev-panel" id="dev-panel">
  <div class="dev-ttl">⚙ DEV MODE — זירת הפשע</div>
  <div class="dev-grid">
    <div class="dev-bi" onclick="devGo('index')">מסך כניסה</div>
    <div class="dev-bi" onclick="devSolve()">פתור הכל</div>
    <div class="dev-bi" onclick="devGo('stage2')">שלב הבא</div>
    <div class="dev-bi" onclick="devGo('stage3')">ספר פרופילים</div>
    <div class="dev-bi" onclick="devGo('stage4')">האשמה</div>
    <div class="dev-bi" onclick="devGo('puzzle')">פאזל מפה</div>
    <div class="dev-bi" onclick="devGo('stage6')">פתיחת קוד</div>
    <div class="dev-bi red" onclick="devReset()" style="grid-column:1/-1">איפוס מלא ↺</div>
  </div>
  <button class="dev-close" onclick="closeDev()">✕ סגור</button>
</div>

<script>
const DEV_CODE='7763';

// ═══════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════
const ANIMALS=[
  {id:'lion',    name:'אריה',     img:'animals/lion.png',    clue:1},
  {id:'elephant',name:'פיל',      img:'animals/elephant.png',clue:2},
  {id:'gorilla', name:'גורילה',   img:'animals/gorilla.png', clue:3},
  {id:'eagle',   name:'נשר',      img:'animals/eagle.png',   clue:4},
  {id:'badger',  name:'גירית',    img:'animals/badger.jpg',  clue:5},
  {id:'wildboar',name:'חזיר בר',  img:'animals/wild_boar.png',clue:6},
  {id:'bear',    name:'דב',       img:'animals/bear.png',    clue:7},
  {id:'tiger',   name:'טיגריס',   img:'animals/tiger.png',   clue:8},
  {id:'chimp',   name:'שימפנזה',  img:'animals/chimpanzee.png',clue:9},
  {id:'pelican', name:'שקנאי',    img:'animals/pelican.png', clue:10},
  {id:'zebra',   name:'זברה',     img:'animals/zebra.png',   clue:11},
  {id:'sloth',   name:'עצלן',     img:'animals/sloth.png',   clue:12},
];
// clue 13 = raccoon (unknown)
const CLUE_COUNT=13;

// NON-FOOTPRINT evidence items shown in phase A
const EXTRA_EVIDENCE=[
  {img:'clues/extra1.png', label:'ענף שבור'},
  {img:'clues/extra2.png', label:'גדר פרוצה'},
  {img:'clues/torn_leaf.jpg', label:'עלה קרוע'},
];

// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
let phase='A'; // A=crime scene popup → B=match footprints
let selectedClue=null; // clue index 1-13 or null
let matches={}; // {animalId: clueNum}
let phaseAStep=0; // 0=show scene, 1=evidence popup, 2=inspector popup

function saveState(){localStorage.setItem('rm_s1',JSON.stringify({phase,matches}));}
function loadState(){try{const s=localStorage.getItem('rm_s1');if(s){const d=JSON.parse(s);phase=d.phase||'A';matches=d.matches||{};}}catch(e){}}

// ═══════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════
let _nt;
function showNotif(m,ok=false){const el=document.getElementById('notif');el.textContent=m;el.className='notif show'+(ok?' ok':'');clearTimeout(_nt);_nt=setTimeout(()=>el.classList.remove('show'),3000);}

function showOv(html){
  document.getElementById('ov-box').innerHTML=html;
  document.getElementById('ov').classList.add('show');
}
function closeOv(){document.getElementById('ov').classList.remove('show');}

window.showInst=function(){
  const titles={A:'הוראות — זירת הפשע',B:'הוראות — התאמת עקבות'};
  const bodies={
    A:'<ul><li>לפניכם זירת הפשע — אגמון הסלע בשמורת עדן.</li><li>עיינו בראיות שנאספו על ידי צוות המז"פ.</li><li>לחצו על כל ראיה לפרטים נוספים.</li></ul>',
    B:'<ul><li>לפניכם 13 עקבות שנמצאו בזירה.</li><li>בצד שמאל — 12 דיירי השמורה. בצד ימין — העקבות.</li><li>לחצו על עקבה, ואז לחצו על החיה המתאימה לה.</li><li>כשסיימתם 12 התאמות — שלחו לאישור המעבדה.</li><li>עקבה 13 לא תתאים לאף חיה — שלחו אותה למעבדה לזיהוי.</li></ul>'
  };
  document.getElementById('inst-title').textContent=titles[phase]||'הוראות';
  document.getElementById('inst-body').innerHTML=bodies[phase]||'';
  document.getElementById('inst-ov').classList.add('show');
};
window.closeInst=()=>document.getElementById('inst-ov').classList.remove('show');

// ═══════════════════════════════════════════════
// PHASE A — crime scene + popups
// ═══════════════════════════════════════════════
function startPhaseA(){
  document.getElementById('main').innerHTML=`<div class="bg-img"></div>`;
  document.getElementById('hdr-title').textContent='זירת הפשע';
  document.getElementById('progress-txt').textContent='';
  document.getElementById('footer-info').textContent='שמורת עדן הסודית — ליד אגמון הסלע';
  phaseAStep=0;
  // Show crime scene for 2.5s then popup
  setTimeout(showEvidencePopup, 2500);
}

function showEvidencePopup(){
  // Build clue thumbnails (all 13)
  let clueHTML='<div class="ev-grid">';
  for(let i=1;i<=CLUE_COUNT;i++){
    const isLast=i===CLUE_COUNT;
    clueHTML+=`<div class="ev-item" onclick="showClueDetail(${i})">
      <img src="clues/c${i}.png" onerror="this.style.opacity='.3'" alt="עקבה ${i}">
      <span>${isLast?'עקבה לא מזוהה':`עקבה ${i}`}</span>
    </div>`;
  }
  // Extra evidence
  EXTRA_EVIDENCE.forEach(e=>{
    clueHTML+=`<div class="ev-item">
      <img src="${e.img}" onerror="this.style.opacity='.3'" alt="${e.label}">
      <span>${e.label}</span>
    </div>`;
  });
  clueHTML+='</div>';

  showOv(`
    <div class="ov-title">🔍 ראיות מהזירה</div>
    <div class="ov-body">
      <p>הגעתם לאגמון הסלע — זירת הפשע.</p>
      <p>יש כאן הרבה ראיות ועקבות. <strong>חלקן טריות וחלקן ישנות יותר.</strong></p>
      <p>צוות המז"פ — מחלקת זיהוי פלילי — אסף את הראיות בשטח על-מנת לנתח אותן במעבדה.</p>
      <p>אלה הראיות והעקבות שנאספו:</p>
      ${clueHTML}
    </div>
    <div class="ov-close">
      <button class="btn-gold" onclick="closeOv();showInspectorPopup()">המשיכו לדבר עם המפקח</button>
    </div>
  `);
}

window.showClueDetail=function(n){
  const isLast=n===CLUE_COUNT;
  showNotif(isLast?'עקבה לא מזוהה — של מי היא?':`עקבה מספר ${n}`);
};

function showInspectorPopup(){
  showOv(`
    <div class="ov-title">👮 שיחה עם הפקח</div>
    <div class="ov-body">
      <p>כדי לעשות סדר בראיות ובעקבות, כדאי לדבר עם הפקח.</p>
      <p>הוא יוכל לספר לכם <strong>אילו חיות גרות בשמורה</strong> — ולהראות לכם את ספר הפרופילים שלו.</p>
      <p>זה גם יקל מאוד על עבודת המעבדה בשלב הבא.</p>
    </div>
    <div class="ov-close" style="flex-direction:column;gap:.6rem">
      <button class="btn-gold" onclick="closeOv();goToProfileBook()">אל ספר הפרופילים</button>
    </div>
  `);
}

window.goToProfileBook=function(){window.location.href='stage3.html';};

// ═══════════════════════════════════════════════
// PHASE B — footprint matching
// ═══════════════════════════════════════════════
function startPhaseB(){
  phase='B';saveState();
  document.getElementById('hdr-title').textContent='בדיקת ראיות';
  document.getElementById('footer-info').textContent='התאימו כל עקבה לחיה המתאימה';
  renderMatchUI();
  updateProgress();
  // Intro popup
  showOv(`
    <div class="ov-title">🧪 בדיקת ראיות</div>
    <div class="ov-body">
      <p>עיינתם בספר הפרופילים וכעת אתם מכירים את כל דיירי השמורה.</p>
      <p>כדי לעזור לצוות המעבדה — <strong>התאימו כל עקבה לחיה שהשאירה אותה.</strong></p>
      <p>לחצו על עקבה בצד ימין, ואז לחצו על החיה המתאימה לה בצד שמאל.</p>
      <p>אחרי 12 התאמות — שלחו לאישור המעבדה.</p>
    </div>
    <div class="ov-close">
      <button class="btn-gold" onclick="closeOv()">התחילו ✓</button>
    </div>
  `);
}

function renderMatchUI(){
  const main=document.getElementById('main');
  let animalsHTML='<div class="col-hdr">חיות השמורה (12)</div>';
  ANIMALS.forEach(a=>{
    const matched=Object.entries(matches).find(([id,_])=>id===a.id);
    const clueNum=matched?matched[1]:null;
    animalsHTML+=`
      <div class="animal-row${clueNum?' matched':''}" id="arow-${a.id}" onclick="selectAnimal('${a.id}')">
        <img src="${a.img}" onerror="this.src=''" alt="${a.name}">
        <span class="animal-name">${a.name}</span>
        <div class="animal-clue-slot${clueNum?' filled':''}">
          ${clueNum?`<img src="clues/c${clueNum}.png" alt="">`:' '}
        </div>
      </div>`;
  });

  let cluesHTML='<div class="col-hdr">עקבות (13)</div><div class="clue-grid">';
  for(let i=1;i<=CLUE_COUNT;i++){
    const usedBy=Object.entries(matches).find(([_,n])=>n===i);
    const sel=selectedClue===i;
    cluesHTML+=`
      <div class="clue-card${usedBy?' used':''}${sel?' selected':''}" id="ccard-${i}" onclick="selectClue(${i})">
        <img src="clues/c${i}.png" onerror="this.style.opacity='.3'" alt="">
        <div class="clue-num">${i===CLUE_COUNT?'?':i}</div>
      </div>`;
  }
  cluesHTML+='</div>';

  main.innerHTML=`
    <div class="match-wrap">
      <div class="col-animals">${animalsHTML}</div>
      <div class="col-clues">${cluesHTML}</div>
    </div>`;
}

window.selectClue=function(n){
  if(Object.values(matches).includes(n))return;
  selectedClue=selectedClue===n?null:n;
  renderMatchUI();
};

window.selectAnimal=function(id){
  if(!selectedClue){showNotif('בחרו קודם עקבה מהרשימה מימין');return;}
  if(selectedClue===CLUE_COUNT){showNotif('העקבה הלא-מזוהה תישלח למעבדה לזיהוי');selectedClue=null;renderMatchUI();return;}
  matches[id]=selectedClue;
  selectedClue=null;
  saveState();
  renderMatchUI();
  updateProgress();
};

function updateProgress(){
  const done=Object.keys(matches).length;
  document.getElementById('progress-txt').textContent=`${done} / 12 התאמות`;
  const footerBtn=document.getElementById('submit-btn');
  if(done>=12&&!footerBtn){
    document.querySelector('.footer').insertAdjacentHTML('afterbegin',
      `<button class="btn-gold" id="submit-btn" style="font-size:.85rem;padding:.5rem 1.2rem" onclick="submitMatches()">שלחו לאישור המעבדה ←</button>`
    );
  }
}

function submitMatches(){
  // Check correctness
  let correct=0;
  ANIMALS.forEach(a=>{if(matches[a.id]===a.clue)correct++;});
  if(correct<12){
    showOv(`
      <div class="ov-title">🔬 תשובה מהמעבדה</div>
      <div class="ov-body">
        <p>המעבדה בדקה את ההתאמות שלכם.</p>
        <p>צדקתם ב-<strong>${correct} מתוך 12</strong> התאמות.</p>
        <p>יש כמה שגיאות — חזרו לבדוק שוב.</p>
      </div>
      <div class="ov-close">
        <button class="btn-outline" onclick="closeOv()">חזרה לבדיקה</button>
      </div>
    `);
    return;
  }
  // All correct!
  showOv(`
    <div class="ov-title">✅ כל הכבוד!</div>
    <div class="ov-body">
      <p>המעבדה אימתה את כל 12 ההתאמות שלכם — <strong>מצוין!</strong></p>
      <p>אבל שימו לב — נמצאה <strong>עקבה 13</strong> שאינה שייכת לאף אחד מדיירי השמורה.</p>
      <p>כדאי לשלוח אותה למעבדה לניתוח — שם יוכלו להגיד לכם לאיזו חיה היא שייכת.</p>
    </div>
    <div class="ov-close">
      <button class="btn-gold" onclick="closeOv();goToLab()">שלחו למעבדה ←</button>
    </div>
  `);
}

window.goToLab=function(){window.location.href='stage2.html';};

// ═══════════════════════════════════════════════
// DEV
// ═══════════════════════════════════════════════
window.openDev=function(){const c=prompt('קוד DEV:');if(c===DEV_CODE)document.getElementById('dev-panel').classList.add('open');else if(c!==null)showNotif('קוד שגוי');};
window.closeDev=()=>document.getElementById('dev-panel').classList.remove('open');
window.devGo=function(id){
  closeDev();
  if(id==='index'){window.location.href='index.html';return;}
  window.location.href=id+'.html';
};
window.devSolve=function(){
  closeDev();
  ANIMALS.forEach(a=>{matches[a.id]=a.clue;});
  saveState();
  if(phase==='B'){renderMatchUI();updateProgress();}
  showNotif('כל ההתאמות מולאו',true);
};
window.devReset=function(){
  if(!confirm('איפוס מלא?'))return;
  closeDev();localStorage.clear();window.location.href='index.html';
};

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
loadState();
if(phase==='B'){
  // Came back from profile book — go straight to matching
  startPhaseB();
} else {
  startPhaseA();
}
</script>
